<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="Découvrez le Quiz des Curieux : testez vos connaissances en Histoire de l'Art des Maîtres peintres à travers un défi visuel passionnant.">
    <title>Quiz Artistes : Score & Niveaux</title>
    <style>
        :root {
            --dark: #1a1a1a;
            --gold: #d4af37;
            --light: #f9f9f9;
            --success: #27ae60;
            --expert: #e67e22;
        }

        body {
            font-family: 'Georgia', serif;
            background-color: #e5e5e5;
            color: var(--dark);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .quiz-card {
            background: white;
            max-width: 700px;
            width: 100%;
            border-radius: 2px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            padding: 30px;
            border-top: 5px solid var(--gold);
        }

        h1 { text-align: center; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 10px; }
        
        /* Barre de Score */
        #score-display {
            text-align: center;
            font-family: sans-serif;
            font-weight: bold;
            font-size: 1.1rem;
            padding: 10px;
            background: #f8f8f8;
            border-radius: 5px;
            margin-bottom: 20px;
            border: 1px dashed #ccc;
        }

        /* Écran de sélection */
        #level-selection {
            text-align: center;
            padding: 40px 0;
        }

        .btn-lvl {
            padding: 20px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            margin: 10px;
            transition: transform 0.2s;
            color: white;
        }

        .btn-lvl:hover { transform: scale(1.05); }
        .bg-debu { background-color: var(--success); }
        .bg-expe { background-color: var(--expert); }

        /* Contenu du Quiz */
        .image-container {
            width: 100%;
            height: 400px;
            background: #eee;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            border: 1px solid #ddd;
        }

        .image-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .option-btn {
            padding: 15px;
            border: 1px solid #ccc;
            background: white;
            cursor: pointer;
            font-size: 1rem;
            transition: 0.2s;
        }

        .option-btn:hover { background: var(--dark); color: white; }

        /* Résultat après chaque question */
        #result-screen {
            display: none;
            margin-top: 25px;
            padding: 20px;
            background: #f0fdf4;
            border: 1px solid var(--success);
            animation: slideUp 0.4s ease-out;
        }

        .artist-info {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-top: 15px;
        }

        .portrait {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--gold);
        }

        .btn-next {
            background: var(--gold);
            color: white;
            border: none;
            padding: 12px 25px;
            margin-top: 20px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }

        .btn-home {
            background: transparent;
            border: none;
            color: #888;
            margin-top: 30px;
            cursor: pointer;
            text-decoration: underline;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="quiz-card">
        <h1>Galerie des Maîtres</h1>
        
        <div id="score-display" style="display: none;">
            Niveau : <span id="lvl-name">...</span> | 
            Score : <span id="current-score">0</span> / <span id="total-questions">0</span>
        </div>

        <div id="level-selection">
            <p>Testez vos connaissances en histoire de l'art</p>
            <button class="btn-lvl bg-debu" onclick="startGame('débutant')">DÉBUTANT</button>
            <button class="btn-lvl bg-expe" onclick="startGame('expert')">EXPERT</button>
        </div>

        <div id="quiz-main-ui" style="display:none;">
            <div class="image-container">
                <img id="main-artwork" src="" alt="Peinture à deviner">
            </div>

            <div id="ui-quiz">
                <div class="options-grid" id="options-box"></div>
            </div>

            <div id="result-screen">
                <h2 style="color: var(--success); margin:0;">Bravo !</h2>
                <div class="artist-info">
                    <img id="artist-portrait" class="portrait" src="" alt="Portrait du peintre">
                    <div>
                        <strong id="artist-name"></strong>
                        <p id="artist-desc" style="font-size: 0.9rem; line-height: 1.4;"></p>
                    </div>
                </div>
                <button class="btn-next" onclick="nextStep()">Continuer la visite →</button>
            </div>
            
            <center><button class="btn-home" onclick="location.reload()">↩ Retour au menu principal</button></center>
        </div>
    </div>
	
	<center><footer>
    <class="footer-menu">
	
       <a href="" data-page=""></a> 
    <p>&copy; 2026 La Galerie des Maîtres- Tous droits réservés.</p>
        
  </footer></center>

<script>
    // BASE DE DONNÉES DES 16 ARTISTES
    const data = [
        { name: "Léonard de Vinci", level: "débutant", painting: "images2/vinci-joconde.jpg", portrait: "images2/vinci-portrait.webp", desc: "Génie de la Renaissance, il a perfectionné la technique du 'sfumato' pour créer des transitions douces.", options: ["Michel-Ange", "Raphaël", "Léonard de Vinci", "Le Caravage"] },
        { name: "Vincent van Gogh", level: "débutant", painting: "images2/van-gogh-nuit.webp", portrait: "images2/van-gogh-portrait.webp", desc: "Maître du post-impressionnisme néerlandais, célèbre pour ses coups de pinceau énergiques et ses couleurs vibrantes.", options: ["Claude Monet", "Vincent van Gogh", "Paul Gauguin", "Edvard Munch"] },
        { name: "Claude Monet", level: "débutant", painting: "images2/monet-nymphéas.jpg", portrait: "images2/monet-portrait.webp", desc: "Chef de file de l'impressionnisme, il a consacré sa vie à capturer les variations de la lumière sur la nature.", options: ["Renoir", "Claude Monet", "Manet", "Degas"] },
        { name: "Pablo Picasso", level: "débutant", painting: "images2/picasso-oeuvre.jpg", portrait: "images2/picasso-portrait.jpg", desc: "Artiste espagnol révolutionnaire et co-fondateur du cubisme, l'un des plus influents du XXe siècle.", options: ["Henri Matisse", "Pablo Picasso", "Georges Braque", "Marc Chagall"] },
        { name: "Frida Kahlo", level: "débutant", painting: "images2/kahlo-oeuvre.webp", portrait: "images2/kahlo-portrait.jpg", desc: "Artiste mexicaine célèbre pour ses autoportraits poignants explorant l'identité, la culture et la douleur.", options: ["Diego Rivera", "Frida Kahlo", "Tarsila do Amaral", "Dalí"] },
        { name: "Edvard Munch", level: "débutant", painting: "images2/munch-cri.jpg", portrait: "images2/munch-portrait.jpg", desc: "Peintre expressionniste norvégien dont l'œuvre explore les thèmes universels de l'angoisse et de l'existence.", options: ["Ensor", "Van Gogh", "Edvard Munch", "Nolde"] },
        { name: "Gustav Klimt", level: "débutant", painting: "images2/klimt-baiser.webp", portrait: "images2/klimt-portrait.jpg", desc: "Figure majeure de la Sécession viennoise, célèbre pour ses compositions ornées de feuilles d'or.", options: ["Egon Schiele", "Gustav Klimt", "Mucho", "Kandinsky"] },
        { name: "Sandro Botticelli", level: "débutant", painting: "images2/botticelli-venus.jpg", portrait: "images2/botticelli-portrait.jpg", desc: "Maître de la Renaissance italienne, célèbre pour l'élégance poétique et la grâce de ses figures mythologiques.", options: ["Donatello", "Sandro Botticelli", "Le Titien", "Fra Angelico"] },
        { name: "Johannes Vermeer", level: "expert", painting: "images2/vermeer-perle.jpg", portrait: "images2/vermeer-portrait.jpg", desc: "Surnommé le 'Sphinx de Delft', il est passé maître dans l'art de capturer la lumière et le silence des scènes d'intérieur.", options: ["Rembrandt", "Rubens", "Johannes Vermeer", "Hals"] },
        { name: "Caravage", level: "expert", painting: "images2/caravage-oeuvre.jpg", portrait: "images2/caravage-portrait.jpg", desc: "Il a bouleversé la peinture baroque avec son naturalisme cru et son usage révolutionnaire du clair-obscur.", options: ["Le Bernin", "Caravage", "Annibal Carrache", "Guercino"] },
        { name: "Diego Velázquez", level: "expert", painting: "images2/velazquez-oeuvre.jpg", portrait: "images2/velazquez-portrait.webp", desc: "Peintre de la cour d'Espagne, il est admiré pour sa maîtrise technique exceptionnelle et son réalisme psychologique.", options: ["Francisco de Zurbarán", "Diego Velázquez", "Ribera", "Murillo"] },
        { name: "Rembrandt", level: "expert", painting: "images2/rembrandt-ronde.jpg", portrait: "images2/rembrandt-portrait.jpg", desc: "Géant de l'âge d'or hollandais, célèbre pour ses autoportraits et sa gestion magistrale de l'ombre et de la lumière.", options: ["Vermeer", "Rembrandt", "Velázquez", "Goya"] },
        { name: "Katsushika Hokusai", level: "expert", painting: "images2/hokusai-vague.jpg", portrait: "images2/hokusai-portrait.jpg", desc: "Grand maître japonais de l'ukiyo-e, ses estampes ont profondément marqué l'art moderne en Occident.", options: ["Hiroshige", "Utamaro", "Katsushika Hokusai", "Kuniyoshi"] },
        { name: "Francisco de Goya", level: "expert", painting: "images2/goya-oeuvre.jpg", portrait: "images2/goya-portrait.jpg", desc: "Considéré comme le dernier des anciens maîtres et le premier des modernes pour sa vision subjective et audacieuse.", options: ["Diego Velázquez", "Francisco de Goya", "El Greco", "Murillo"] },
        { name: "Henri Matisse", level: "expert", painting: "images2/matisse-oeuvre.webp", portrait: "images2/matisse-portrait.webp", desc: "Fondateur du fauvisme, il a révolutionné l'art par la simplification des formes et l'usage expressif de la couleur.", options: ["André Derain", "Raoul Dufy", "Henri Matisse", "Maurice de Vlaminck"] },
        { name: "Eugène Delacroix", level: "expert", painting: "images2/delacroix-oeuvre.jpg", portrait: "images2/delacroix-portrait.jpg", desc: "Chef de file du romantisme français, son style se définit par le mouvement, l'énergie et la couleur émotionnelle.", options: ["Théodore Géricault", "Eugène Delacroix", "Ingres", "Courbet"] }
    ];

    let filteredQuestions = [];
    let currentQuest = 0;
    let score = 0;

    function startGame(lvl) {
        // 1. Filtrer et mélanger
        filteredQuestions = data.filter(item => item.level === lvl);
        filteredQuestions.sort(() => Math.random() - 0.5);
        
        // 2. Réinitialiser le score et l'UI
        score = 0;
        currentQuest = 0;
        document.getElementById('lvl-name').innerText = lvl.toUpperCase();
        document.getElementById('current-score').innerText = score;
        document.getElementById('total-questions').innerText = filteredQuestions.length;
        
        // 3. Basculer l'affichage
        document.getElementById('score-display').style.display = 'block';
        document.getElementById('level-selection').style.display = 'none';
        document.getElementById('quiz-main-ui').style.display = 'block';
        
        setupQuestion();
    }

    function setupQuestion() {
        const q = filteredQuestions[currentQuest];
        document.getElementById('ui-quiz').style.display = 'block';
        document.getElementById('result-screen').style.display = 'none';
        
        // Image de l'oeuvre
        const mainImg = document.getElementById('main-artwork');
        mainImg.src = q.painting;
        mainImg.onerror = () => { mainImg.src = "https://via.placeholder.com/600x400?text=Image+Manquante"; };

        // Générer les boutons
        const optionsBox = document.getElementById('options-box');
        optionsBox.innerHTML = '';
        q.options.forEach(choice => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = choice;
            btn.onclick = () => {
                if(choice === q.name) {
                    score++;
                    document.getElementById('current-score').innerText = score;
                    showSuccess(q);
                } else {
                    alert("Ce n'est pas la bonne réponse. Regardez bien les détails !");
                }
            };
            optionsBox.appendChild(btn);
        });
    }

    function showSuccess(q) {
        document.getElementById('ui-quiz').style.display = 'none';
        document.getElementById('result-screen').style.display = 'block';
        document.getElementById('artist-name').innerText = q.name;
        document.getElementById('artist-desc').innerText = q.desc;
        document.getElementById('artist-portrait').src = q.portrait;
        document.getElementById('artist-portrait').onerror = () => { 
            document.getElementById('artist-portrait').src = "https://via.placeholder.com/100?text=Portrait"; 
        };
    }

    function nextStep() {
        currentQuest++;
        if(currentQuest >= filteredQuestions.length) {
            alert("Félicitations ! Votre score final est de " + score + " / " + filteredQuestions.length);
            location.reload(); 
        } else {
            setupQuestion();
        }
    }
</script>

</body>
</html>
